# Contenedor "frontend": sirve la aplicación React compilada y actúa como proxy inverso de la API.
# Termina TLS (HTTPS) con el certificado montado en /etc/nginx/certs: en producción, el certificado
# institucional (tls.crt y tls.key); si no se provee ninguno, al iniciar se genera uno autofirmado.

# HTTP: solo redirige a HTTPS (y expone /healthz para el chequeo de salud del contenedor)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Los planes admiten reportes de hasta 100 MB (Tabla 17); el valor por defecto de Nginx es 1 MB
    client_max_body_size 110m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reenvía /api/* al contenedor "api" de la red interna de Docker (dss-net)
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
