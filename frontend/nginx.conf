server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reenvía /api/* al contenedor "api" de la red interna Docker (dss-net).
    # En producción real, esta función la cumple el Nginx del host descrito en
    # el Capítulo IV; este proxy interno hace que `docker compose up` funcione
    # de forma autocontenida sin depender de esa capa adicional.
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
