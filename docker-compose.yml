# Arquitectura física del sistema Roshka DSS (Capítulo IV de la tesis):
# tres contenedores — db (PostgreSQL 15), api (ASP.NET Core) y frontend (React servido por Nginx) —
# sobre una red Docker privada, con volúmenes nombrados para los datos y los respaldos.
#
# Uso:
#   cp .env.example .env   # completar las variables obligatorias
#   docker compose up --build -d
#   docker compose ps      # los tres servicios deben figurar como "healthy"
#
# Acceso: https://<servidor>/ (el puerto HTTP solo redirige a HTTPS). Nginx, dentro del contenedor
# frontend, termina TLS con el certificado de ./certs (tls.crt y tls.key); si no existe, genera uno
# autofirmado. La API solo es accesible desde el propio servidor (127.0.0.1) y a través de Nginx en
# /api; la base de datos no publica ningún puerto fuera de la red interna.

services:
  db:
    image: postgres:15
    container_name: dss-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-DecisionSupport}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql:ro
      - ./database/suscripcion_schema.sql:/docker-entrypoint-initdb.d/3_suscripcion_schema.sql:ro
      - ./database/suscripcion_seed.sql:/docker-entrypoint-initdb.d/4_suscripcion_seed.sql:ro
    networks: [dss-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: dss-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-DecisionSupport};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}"
      Jwt__Key: ${JWT_KEY:?falta JWT_KEY en .env (32+ caracteres)}
      Jwt__Issuer: DecisionSupportAPI
      Jwt__Audience: DecisionSupportClient
      Jwt__ExpirationMinutes: "60"
      Proxy__ConfiarEncabezadosReenviados: "true"   # la IP real del cliente llega desde Nginx
      Backup__PgDumpPath: /usr/bin/pg_dump
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-smtp.gmail.com}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_USERNAME:-}
      Email__FromName: "Roshka DSS"
      AdamsPay__ApiKey: ${ADAMSPAY_API_KEY:-}
      AdamsPay__ApiSecret: ${ADAMSPAY_API_SECRET:-}
      PayPal__ClientId: ${PAYPAL_CLIENT_ID:-}
      PayPal__Secret: ${PAYPAL_SECRET:-}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    volumes:
      - respaldos:/app/backups   # archivos .sql del respaldo periódico (RNF12)
    networks: [dss-net]
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"   # solo desde el propio servidor; el acceso normal es vía Nginx
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: dss-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TLS_CN: ${TLS_CN:-localhost}
    volumes:
      - ./certs:/etc/nginx/certs
    networks: [dss-net]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  dss-net:
    driver: bridge

volumes:
  postgres_data:
  respaldos:
